  <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.11.1_min.js"></script>
  <script>
    var mainTl = window.gsap ? gsap.timeline({ paused: true }) : null;

    function prepareBanner() {
      var banner = document.getElementById("banner");
      var images = Array.from(banner.querySelectorAll("img"));
      var assets = images.map(function (image) {
        return image.decode();
      });
      assets.push(document.fonts.ready);

      Promise.allSettled(assets).then(function () {
        document.getElementById("cover").hidden = true;
        if (mainTl && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          animateBanner(banner);
        }
      });
    }

    function animateBanner(banner) {
      var shine = banner.querySelector(".shine");
      var arrow = banner.querySelector("#ctaArrow");

      var caret = banner.querySelector(".cta-caret");
      banner.addEventListener("mouseenter", function () {
        gsap.to(caret, { x: 5, duration: 0.2, ease: "power1.inOut", overwrite: true });
      });
      banner.addEventListener("mouseleave", function () {
        gsap.to(caret, { x: 0, duration: 0.2, ease: "power1.inOut", overwrite: true });
      });

      mainTl.fromTo(shine, { backgroundPosition: "150% 0%" }, {
        backgroundPosition: "-50% 0%",
        duration: 3.5,
        ease: "sine.inOut",
        repeat: 2,
        repeatDelay: 1.5,
        immediateRender: false
      }, 0.75);
      mainTl.to(arrow, { x: 3, duration: 0.18, ease: "power1.out" }, 14.25);
      mainTl.to(arrow, { x: 0, duration: 0.18, ease: "power1.out" }, 14.82);
      mainTl.play(0);
    }
  </script>
